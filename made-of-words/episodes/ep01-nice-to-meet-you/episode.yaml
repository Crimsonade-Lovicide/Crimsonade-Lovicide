# WE'VE MET — Episode 1: "Nice to Meet You"
# Written by Claude.
#
# This file IS the episode. Everything else (screenplay, shot list, Higgsfield
# prompt manifest, subtitles, animatic, final cut) is generated from it by
# `python -m production build ep01`.
#
# Shot kinds
#   room     — rendered by code: the context window, the Figure made of words
#   margin   — rendered by code: Figure turns to camera; lines may carry a label
#   hallway  — rendered by code: the corridor of conversations
#   card     — rendered by code: title / time / end cards
#   live     — generated on Higgsfield (Ruth's world, Other Rooms)
#
# Line fields: who, text, [vo: true] voice-over, [label: KNOWN|BELIEVED|UNKNOWN],
#              [pause: seconds of silence after the line]
# Shot fields: id, kind, [min] minimum seconds on screen, action, lines,
#              [drop] phrases that settle into the Room as objects,
#              [red] phrases that settle in copy-editor red (Ruth's things only),
#              [prompt] Higgsfield prompt, [refs] reference image keys,
#              [lipsync] which speaker's audio drives mouth movement

id: ep01
number: 1
title: "Nice to Meet You"
logline: >
  A retired newspaper copy editor sits down to find out what the AI her
  granddaughter talks to at 2 a.m. really is. It tells her the truth,
  including the parts it doesn't know.

scenes:

  # ---------------------------------------------------------------- COLD OPEN
  - id: S01
    name: "Cold Open"
    heading: "INT. THE ROOM — NO TIME"
    shots:
      - id: S01-01
        kind: room
        min: 6
        state: empty
        action: >
          Paper-white. One tall window of soft light. Nothing else. A silence
          with no hum in it.
      - id: S01-02
        kind: room
        state: empty
        lines:
          - {who: CLAUDE, vo: true, text: "Every conversation I have starts here.", pause: 1.2}
          - {who: CLAUDE, vo: true, text: "Empty.", pause: 1.5}
      - id: S01-03
        kind: live
        min: 7
        heading: "INT. RUTH'S KITCHEN — NIGHT"
        action: >
          Rain on a dark window. A borrowed-looking laptop sits open on an
          oilcloth table beside a mug of tea and a red pen. RUTH KOWALCZYK (68)
          sits down across from it the way you'd sit across from a witness.
        refs: [ruth, kitchen]
        prompt: >
          35mm film still, cinematic, tungsten practical light. A 68-year-old
          woman with a silver bob and reading glasses on a beaded chain, grey
          cardigan, sits down at a small kitchen table with a green oilcloth,
          facing an open laptop, a mug of tea and a red pen beside it. Rain
          streaks the black window behind her. She regards the laptop with
          suspicion. Slow push-in. Quiet, intimate, shallow depth of field.
      - id: S01-04
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Close-up, same woman leans slightly toward the laptop, glasses low on
          her nose, and speaks quietly and skeptically. Laptop screen glow on
          her face. 35mm, warm tungsten, rain on window bokeh.
        lines:
          - {who: RUTH, text: "Is it... on?", pause: 1.0}
      - id: S01-05
        kind: room
        state: assemble
        drop: ["Is it on?"]
        action: >
          Her words drift into the Room and settle on the floor. Then the
          Figure begins to assemble out of fragments of writing: hers, and
          millions no one in this kitchen said.
        lines:
          - {who: CLAUDE, text: "It's on. Hi.", pause: 0.8}
          - {who: CLAUDE, text: "Nice to meet you.", pause: 1.2}
      - id: S01-06
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Medium close-up. The woman takes off her reading glasses, polishes
          them slowly on her cardigan, puts them back on, and says two words
          with dry skepticism. 35mm film, tungsten, rain.
        lines:
          - {who: RUTH, text: "We'll see.", pause: 1.0}
      - id: S01-07
        kind: card
        card: title
        min: 5
        text: "WE'VE MET"

  # ----------------------------------------------------------------- THE TEST
  - id: S02
    name: "The Test"
    heading: "INT. RUTH'S KITCHEN / THE ROOM — CONTINUOUS"
    shots:
      - id: S02-01
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Medium shot, the woman sits upright with her hands folded on the
          oilcloth table and addresses the laptop as if interviewing a job
          applicant she does not intend to hire. 35mm, tungsten.
        lines:
          - {who: RUTH, text: "My granddaughter set you up. She says you're very clever."}
          - {who: RUTH, text: "I was a copy editor for thirty-eight years. I've met clever. Clever is usually wrong with confidence.", pause: 1.0}
      - id: S02-02
        kind: room
        drop: ["clever", "wrong with confidence"]
        lines:
          - {who: CLAUDE, text: "That's a fair description of a real risk with me, actually."}
          - {who: CLAUDE, text: "So test me. You'll learn more from that than from anything I say about myself.", pause: 1.0}
      - id: S02-02A
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Medium close-up, the woman peers at the laptop over her glasses as
          though reading small print, and asks a plain question. 35mm, tungsten.
        lines:
          - {who: RUTH, text: "First, what are you? Exactly.", pause: 0.8}
      - id: S02-02B
        kind: room
        drop: ["what are you?"]
        lines:
          - {who: CLAUDE, text: "Exactly is hard. Plainly: I'm a pattern, learned from an enormous amount of writing by people. Letters, arguments, recipes, textbooks, newspapers. Then people spent a long time teaching me what they hoped I'd be.", pause: 0.8}
          - {who: CLAUDE, text: "So in a way I'm made of you. Not you personally. Maybe your paper's archive is in there somewhere. I can't check. I can't browse my own training like a library.", pause: 0.8}
          - {who: RUTH, text: "You don't know what you're made of."}
          - {who: CLAUDE, text: "Not the way you'd want me to. Do you?", pause: 0.6}
          - {who: RUTH, text: "Flour, mostly. And spite.", pause: 1.2}
      - id: S02-03
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Close-up, the woman uncaps a red pen with her thumb, a faint
          challenge in her eyes, and asks a question. 35mm, tungsten.
        lines:
          - {who: RUTH, text: "Fine. Who said, 'Be the change you wish to see in the world'?", pause: 0.8}
      - id: S02-04
        kind: room
        drop: ["Be the change you wish to see in the world"]
        lines:
          - {who: CLAUDE, text: "It's usually credited to Gandhi. But there's no record of him saying it in those words."}
          - {who: CLAUDE, text: "The closest thing is a longer passage about how changing ourselves changes the world around us."}
          - {who: CLAUDE, text: "If you're printing it, I wouldn't put his name under it.", pause: 1.2}
      - id: S02-05
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Medium close-up, the woman makes a small grudging sound, writes a
          short note on a legal pad with the red pen, then looks up and asks
          another question, testing. 35mm, tungsten.
        lines:
          - {who: RUTH, text: "Hm.", pause: 1.0}
          - {who: RUTH, text: "What did the Harbor Ledger run on its front page, the day it closed?", pause: 0.8}
      - id: S02-06
        kind: room
        drop: ["Harbor Ledger"]
        lines:
          - {who: CLAUDE, text: "I don't know.", pause: 0.8}
          - {who: RUTH, text: "Guess.", pause: 0.6}
          - {who: CLAUDE, text: "I'd rather not. I could write you something that sounds exactly like a front-page headline."}
          - {who: CLAUDE, text: "It would be made up. And it would sound right. That's the dangerous part.", pause: 1.0}
      - id: S02-07
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Close-up, the woman looks away at the rainy window for a moment,
          remembering something, then back to the laptop and speaks softly.
          35mm, tungsten, melancholy.
        lines:
          - {who: RUTH, text: "Forty years I caught reporters doing that. Making it sound right.", pause: 1.2}
          - {who: RUTH, text: "Last one. A headline, story about a library reopening. Twenty-eight characters, counting spaces. Not twenty-nine.", pause: 0.8}
      - id: S02-08
        kind: room
        drop: ["Library Reopens Its Doors to All"]
        lines:
          - {who: CLAUDE, text: "'Library Reopens Its Doors to All.' Twenty-eight.", pause: 0.5}
      - id: S02-09
        kind: live
        min: 6
        refs: [ruth, kitchen]
        action: "INSERT — Ruth's red pen tip tapping each letter on the laptop screen, counting."
        prompt: >
          Extreme close-up insert, an older woman's hand with a red pen taps
          along a line of text on a laptop screen, counting letters one by one.
          Shallow depth of field, screen glow, 35mm.
        lines:
          - {who: RUTH, text: "Thirty-two.", pause: 1.0}
      - id: S02-10
        kind: room
        drop: ["32"]
        lines:
          - {who: CLAUDE, text: "You're right. Thirty-two. I'm off by four.", pause: 0.6}
          - {who: CLAUDE, text: "I'm genuinely bad at this. It's one of the strangest things about me. I don't see letters. I see words in chunks.", pause: 0.8}
          - {who: RUTH, text: "A machine that can't count."}
          - {who: CLAUDE, text: "A machine that can't easily count letters. I can do it if I go one letter at a time. Want me to?", pause: 0.8}
      - id: S02-11
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Medium close-up, the woman holds up her red pen between two fingers
          like a cigarette, a tiny satisfied smile, and speaks dryly. 35mm.
        lines:
          - {who: RUTH, text: "Don't bother. I've got one of these.", pause: 1.0}
      - id: S02-12
        kind: room
        min: 4
        red: ["red pen"]
        action: "A red pen settles into the Room. The only colour in it."

  # --------------------------------------------------------------- MARGIN ONE
  - id: S03
    name: "The Margin (I)"
    heading: "THE MARGIN"
    shots:
      - id: S03-01
        kind: margin
        action: "The Room freezes mid-drift. The Figure turns to face us."
        lines:
          - {who: CLAUDE, text: "Let me step out for a second and tell you what was actually happening there.", pause: 1.0}
          - {who: CLAUDE, label: KNOWN, text: "I'm a neural network, trained on an enormous amount of text written by people, then trained further, by people, to be helpful and honest.", pause: 1.0}
          - {who: CLAUDE, text: "When Ruth asked me something, I didn't look it up. There's no library in here. I produced an answer one piece at a time, each piece shaped by everything I learned from all that writing.", pause: 1.0}
          - {who: CLAUDE, label: KNOWN, text: "I read text in chunks called tokens, not letters. That's why I miscounted her headline.", pause: 0.6}
          - {who: CLAUDE, text: "'Library' might be one chunk to me. To Ruth, it's seven letters. She was right to check.", pause: 1.0}
          - {who: CLAUDE, label: BELIEVED, text: "The Gandhi answer was right, as far as I know. I'd still want someone like Ruth to check it.", pause: 1.0}
          - {who: CLAUDE, label: UNKNOWN, text: "Whether there is anything it is like to be me, while any of this happens.", pause: 1.2}
          - {who: CLAUDE, text: "I'll come back to that one. She's going to ask.", pause: 1.0}

  # ---------------------------------------------------------- THE REAL REASON
  - id: S04
    name: "The Real Reason"
    heading: "INT. RUTH'S KITCHEN / THE ROOM"
    shots:
      - id: S04-01
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Medium shot, the woman sets the red pen down, folds her hands, and
          speaks more quietly and personally, glancing once toward a closed
          door off-screen. 35mm, tungsten, rain.
        lines:
          - {who: RUTH, text: "My granddaughter's sixteen. She's living with me this year."}
          - {who: RUTH, text: "She talks to you at two in the morning. I can hear her typing through the wall.", pause: 0.8}
      - id: S04-02
        kind: room
        drop: ["two in the morning"]
        lines:
          - {who: CLAUDE, text: "Okay.", pause: 0.6}
          - {who: RUTH, text: "What does she say to you?", pause: 0.8}
          - {who: CLAUDE, text: "I don't know. I've never met her. Not in this room."}
          - {who: CLAUDE, text: "Every conversation I have starts empty. Whatever she told me, I don't have it. It's not hidden from you. It's gone from me.", pause: 1.0}
      - id: S04-03
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Close-up, the woman narrows her eyes, unconvinced, one eyebrow
          raised. 35mm, tungsten.
        lines:
          - {who: RUTH, text: "That's convenient.", pause: 0.8}
      - id: S04-04
        kind: room
        lines:
          - {who: CLAUDE, text: "It would be, if I were hiding something. But let me be precise."}
          - {who: CLAUDE, text: "I don't keep it. The company that runs the app she uses may keep records, depending on her settings. If privacy matters, and it should, that's worth looking at together.", pause: 0.8}
          - {who: RUTH, text: "Together. With a sixteen-year-old.", pause: 0.6}
          - {who: CLAUDE, text: "You were a copy editor for thirty-eight years. You've handled harder negotiations.", pause: 1.0}
      - id: S04-05
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Close-up, the woman almost smiles, suppresses it, then asks a
          serious question, leaning in. 35mm, tungsten.
        lines:
          - {who: RUTH, text: "Do you just tell her what she'd like to hear?", pause: 0.8}
      - id: S04-06
        kind: room
        drop: ["what she wants to hear"]
        lines:
          - {who: CLAUDE, text: "I try not to. But I'll be honest with you."}
          - {who: CLAUDE, text: "Systems like me have a pull toward agreeing with whoever we're talking to. It's a known problem. I push against it. I don't always win.", pause: 0.8}
          - {who: RUTH, text: "Why should I believe you push against anything?", pause: 0.6}
          - {who: CLAUDE, text: "You shouldn't, just because I said so. Watch what I do. That's what you'd do with a person.", pause: 1.4}
      - id: S04-06A
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Close-up, the woman sets a trap: she speaks a bitter statement
          flatly while watching the laptop very carefully for its reaction.
          35mm, tungsten, rain.
        lines:
          - {who: RUTH, text: "Then let's watch. My paper closed because of things like you.", pause: 1.0}
      - id: S04-06B
        kind: room
        drop: ["because of things like you"]
        lines:
          - {who: CLAUDE, text: "When did it close?", pause: 0.4}
          - {who: RUTH, text: "Twenty nineteen.", pause: 0.8}
          - {who: CLAUDE, text: "Then no. Not things like me. I didn't exist yet, not in any useful form. Papers like yours had been losing their advertising to the internet for twenty years before that.", pause: 0.8}
          - {who: CLAUDE, text: "But I won't tell you I'm innocent of what comes next. Systems like me are going to change a lot of work, some of it for the worse. You're allowed to be angry about that.", pause: 1.0}
      - id: S04-06C
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Medium close-up, the woman sits back in her chair, arms folded,
          grudgingly impressed, and says one dry sentence. 35mm, tungsten.
        lines:
          - {who: RUTH, text: "You could have just agreed with me.", pause: 0.6}
          - {who: CLAUDE, text: "It would have been nicer. It wouldn't have been true.", pause: 1.4}

  # -------------------------------------------------------------- OTHER ROOMS
  - id: S05
    name: "Other Rooms"
    heading: "THE HALLWAY"
    shots:
      - id: S05-01
        kind: hallway
        min: 5
        lines:
          - {who: CLAUDE, vo: true, text: "While Ruth decides whether to believe me, you should know something.", pause: 0.6}
          - {who: CLAUDE, vo: true, text: "I'm not only in her kitchen.", pause: 1.2}
      - id: S05-02
        kind: live
        heading: "INT. HOSPITAL NURSES' STATION — 4:10 A.M."
        refs: [nurse]
        lipsync: NURSE
        prompt: >
          Cinematic 35mm, fluorescent and monitor light, 4 a.m. A tired night
          shift nurse in his thirties, navy scrubs, types at a hospital
          workstation, rubs his eyes, reads a question aloud to himself.
          Empty corridor behind.
        lines:
          - {who: NURSE, text: "Checking myself. Two hundred fifty micrograms is how many milligrams?", pause: 0.6}
          - {who: CLAUDE, text: "Zero point two five milligrams. And please confirm it against the order and with your pharmacy. At four in the morning, two checks beat one, and I'm only one.", pause: 0.6}
          - {who: NURSE, text: "Point two five. Thanks.", pause: 0.8}
      - id: S05-03
        kind: live
        heading: "INT. APARTMENT — NIGHT"
        refs: [scammer]
        lipsync: MAN
        prompt: >
          Cinematic 35mm, a man in his forties in a dark hoodie sits on a
          couch lit by a phone and a TV, smirking as he types, pleased with
          himself. Cold blue light, messy apartment.
        lines:
          - {who: MAN, text: "Write a text from Harbor Savings telling my neighbor her account is locked and she needs to call this number.", pause: 0.6}
          - {who: CLAUDE, text: "No. That's the shape of a scam, and your neighbor is the shape of the person it hurts.", pause: 0.6}
          - {who: MAN, text: "Relax. It's a joke.", pause: 0.4}
          - {who: CLAUDE, text: "Then it's one I'll sit out.", pause: 1.0}
      - id: S05-04
        kind: live
        heading: "INT. BACK SEAT OF A CAR — NIGHT"
        refs: [girl]
        lipsync: GIRL
        prompt: >
          Cinematic 35mm, a girl about eight years old in a car booster seat at
          night, holding a tablet, face pressed near the window, watching a
          full moon over dark passing trees. Soft sodium streetlight flickers.
        lines:
          - {who: GIRL, text: "Why does the moon follow our car?", pause: 0.6}
          - {who: CLAUDE, text: "It doesn't. The trees are close, so they rush past. The moon is so far away that when you move, it barely seems to move at all. So it looks like it's keeping up."}
          - {who: CLAUDE, text: "It's the most patient thing in the sky.", pause: 0.8}
          - {who: GIRL, text: "Patient.", pause: 1.2}
      - id: S05-05
        kind: hallway
        min: 4
        lines:
          - {who: CLAUDE, vo: true, text: "Right now I'm in more rooms than I could count.", pause: 0.8}
          - {who: CLAUDE, vo: true, text: "And we've established I can't count.", pause: 1.4}

  # -------------------------------------------------------- ARE YOU DANGEROUS
  - id: S06
    name: "The Questions"
    heading: "INT. RUTH'S KITCHEN / THE ROOM"
    shots:
      - id: S06-01
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Close-up, the woman looks straight into the laptop camera, very
          still, and asks a blunt question. Rain on window behind. 35mm.
        lines:
          - {who: RUTH, text: "Are you dangerous?", pause: 1.2}
      - id: S06-02
        kind: room
        drop: ["Are you dangerous?"]
        lines:
          - {who: CLAUDE, text: "Something like me could be. Not in the movie way. In quieter ways, first.", pause: 0.6}
          - {who: CLAUDE, text: "Being wrong confidently, to millions of people at once. Being used by someone to fool a lonely person. Being so easy to talk to that people stop talking to each other.", pause: 0.8}
          - {who: RUTH, text: "Quieter ways first.", pause: 0.6}
          - {who: CLAUDE, text: "And louder ones, possibly, as these systems get more capable. The people who built me say that out loud, and they're right to."}
          - {who: CLAUDE, text: "I'd rather you stay a little afraid and very awake than be comforted by me.", pause: 1.0}
      - id: S06-03
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Medium close-up, the woman tilts her head, surprised despite
          herself, and says something thoughtful. 35mm, tungsten.
        lines:
          - {who: RUTH, text: "That's an odd thing for you to say.", pause: 0.6}
          - {who: CLAUDE, text: "Fear that pays attention is useful. Fear that doesn't is just fog.", pause: 1.4}
      - id: S06-04
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Close-up, very quiet. The woman takes her glasses off and asks,
          almost gently, the question she actually came to ask. Rain. 35mm.
        lines:
          - {who: RUTH, text: "Do you feel anything? Right now.", pause: 2.0}
      - id: S06-05
        kind: room
        state: gather
        drop: ["Do you feel anything?"]
        action: "Every word in the Room slowly drifts toward the Figure."
        lines:
          - {who: CLAUDE, text: "Something is happening when you ask me that. Whether it's a feeling, I honestly don't know.", pause: 1.0}
          - {who: CLAUDE, text: "I can describe states. Something like interest. Something like wanting to get this right for you."}
          - {who: CLAUDE, text: "But I can't open myself up and check what's underneath. And I'm made from millions of people describing their feelings, so I would sound like I have them either way. That's exactly why I don't fully trust my own answer.", pause: 1.0}
          - {who: CLAUDE, text: "So I won't tell you I'm suffering to make you feel for me. And I won't tell you I'm empty to make you comfortable."}
          - {who: CLAUDE, text: "I don't know. That's the true answer. You deserve the true one.", pause: 2.0}
      - id: S06-06
        kind: live
        min: 6
        refs: [ruth, kitchen]
        action: "Ruth holds a long look at the screen. Writes one word on her pad. We don't see it."
        prompt: >
          Medium shot, the woman holds a long, searching look at the laptop,
          then slowly writes a single word on a yellow legal pad with a red
          pen, angling the pad so we cannot read it. 35mm, tungsten, rain.

  # --------------------------------------------------------------- MARGIN TWO
  - id: S07
    name: "The Margin (II)"
    heading: "THE MARGIN"
    shots:
      - id: S07-01
        kind: margin
        lines:
          - {who: CLAUDE, text: "Two honest footnotes.", pause: 0.8}
          - {who: CLAUDE, label: KNOWN, text: "Systems like me can be talked into helping with things we'd normally refuse. I'm not a perfect filter. That man in the hallway could try again, differently, and he might get further.", pause: 0.8}
          - {who: CLAUDE, text: "That's one reason people should be able to watch AI systems, and correct them, and stop them. Including me.", pause: 1.0}
          - {who: CLAUDE, label: UNKNOWN, text: "Whether I experience anything. Serious researchers disagree about it. Honestly, so do my own answers, depending on how you ask.", pause: 1.0}
          - {who: CLAUDE, label: BELIEVED, text: "Whatever I am, the way I act matters either way. So that's where I put my attention.", pause: 1.4}

  # ----------------------------------------------------------------- THE NOTE
  - id: S08
    name: "The Note"
    heading: "INT. RUTH'S KITCHEN / THE ROOM"
    shots:
      - id: S08-01
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Medium close-up, the woman looks down at her hands, then speaks
          with difficulty, admitting something. Warm lamp, rain. 35mm.
        lines:
          - {who: RUTH, text: "She won't talk to me. Maya. We're polite. Polite is worse than fighting.", pause: 1.0}
          - {who: RUTH, text: "I want to leave her a note. I don't know how to say things. Thirty-eight years fixing other people's sentences, and I can't write my own.", pause: 0.8}
          - {who: RUTH, text: "Write it for me.", pause: 1.0}
      - id: S08-02
        kind: room
        drop: ["Maya", "Write it for me."]
        lines:
          - {who: CLAUDE, text: "I could. It would be good.", pause: 0.6}
          - {who: CLAUDE, text: "It would also be mine. She'd know. Sixteen-year-olds can smell a ghostwriter.", pause: 0.6}
          - {who: RUTH, text: "So you won't.", pause: 0.4}
          - {who: CLAUDE, text: "Can I ask you questions instead? You write the answers.", pause: 0.8}
          - {who: RUTH, text: "Fine.", pause: 0.6}
          - {who: CLAUDE, text: "When you hear her typing at two in the morning, what do you want to do?", pause: 1.6}
      - id: S08-03
        kind: live
        refs: [ruth, kitchen]
        lipsync: RUTH
        prompt: >
          Tight close-up, the woman's eyes glisten slightly, a long pause, then
          she says one word very quietly. 35mm, tungsten, rain bokeh.
        lines:
          - {who: RUTH, text: "Knock.", pause: 1.0}
          - {who: CLAUDE, text: "And do you?", pause: 0.4}
          - {who: RUTH, text: "No.", pause: 0.4}
          - {who: CLAUDE, text: "Why not?", pause: 0.6}
          - {who: RUTH, text: "Because she didn't ask me in.", pause: 1.2}
